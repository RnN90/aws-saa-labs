name: Terraform CI

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'labs/**/terraform/**'
      - '.github/workflows/terraform-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'labs/**/terraform/**'
      - '.github/workflows/terraform-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover Terraform Labs
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.labs.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover Terraform directories
        id: labs
        shell: bash
        run: |
          MATRIX=$(find labs -type f -name 'versions.tf' \
            -path '*/terraform/versions.tf' \
            -printf '%h\n' | sort -u | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          echo "Terraform directories:"
          echo "$MATRIX" | jq .

  validate:
    name: Validate ${{ matrix.directory }}
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate -no-color
